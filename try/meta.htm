<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manya Metadata Manager</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Manya Metadata Manager</h1>
    <form id="metadataForm">
      <label for="subject">Subject:</label>
      <input type="text" id="subject" required>

      <label for="difficulty">Difficulty:</label>
      <select id="difficulty" required>
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
      </select>

      <label for="examYear">Exam Year:</label>
      <input type="number" id="examYear" required>

      <label for="note">Note:</label>
      <textarea id="note" rows="3"></textarea>

      <button type="submit">Add Metadata</button>
    </form>

    <div class="metadata-list" id="metadataList">
      <!-- Metadata entries will appear here -->
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
