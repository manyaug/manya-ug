<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manya | 3D Texture & Mesh Crusher</title>
    
    <!-- 1. MODEL VIEWER -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
        :root {
            --bg: #020617; --panel: #0f172a; --primary: #8b5cf6; 
            --text: #f8fafc; --text-dim: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg); color: var(--text);
            margin: 0; height: 100vh;
            display: grid; grid-template-columns: 1fr 340px;
            overflow: hidden;
        }

        /* WORKSPACE */
        .workspace {
            position: relative;
            background: radial-gradient(circle at center, #1e293b 0%, #000 100%);
            display: flex; align-items: center; justify-content: center;
        }
        model-viewer { width: 100%; height: 100%; }

        .drop-zone {
            position: absolute; inset: 20px;
            border: 2px dashed #334155; border-radius: 20px;
            background: rgba(15, 23, 42, 0.95);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10; transition: 0.2s;
        }
        .drop-zone.hidden { opacity: 0; pointer-events: none; }
        .drop-zone.active { border-color: var(--primary); background: rgba(139, 92, 246, 0.1); }

        /* SIDEBAR */
        .sidebar {
            background: var(--panel); border-left: 1px solid #334155;
            padding: 20px; display: flex; flex-direction: column; gap: 20px;
            overflow-y: auto;
        }

        h1 { margin: 0; font-size: 1.2rem; color: var(--primary); letter-spacing: 1px; }
        .section-title { font-size: 0.7rem; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }

        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .stat-card { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; text-align: center; }
        .stat-val { font-family: monospace; font-size: 1.1rem; font-weight: 700; display: block; }
        .stat-label { font-size: 0.7rem; color: var(--text-dim); }

        /* CONTROLS */
        .control-box { background: rgba(255,255,255,0.03); padding: 15px; border-radius: 10px; border: 1px solid #334155; }
        
        select, input[type=range] {
            width: 100%; background: #1e293b; color: white; border: 1px solid #475569;
            padding: 8px; border-radius: 6px; margin-top: 5px; outline: none;
        }
        
        .btn {
            width: 100%; padding: 14px; border-radius: 8px; border: none;
            font-weight: 800; cursor: pointer; background: var(--primary); color: white;
            transition: 0.2s; font-size: 0.9rem;
        }
        .btn:disabled { background: #334155; color: #64748b; cursor: wait; }
        .btn-success { background: #22c55e; display: none; }

        .log { font-family: monospace; font-size: 0.75rem; color: #facc15; margin-top: auto; min-height: 20px; }
    </style>

    <!-- 2. IMPORT MAP -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <!-- 3. DRAG BLOCKER -->
    <script>
        window.addEventListener("dragover", e => e.preventDefault());
        window.addEventListener("drop", e => e.preventDefault());
    </script>

    <div class="workspace">
        <model-viewer id="preview" camera-controls auto-rotate shadow-intensity="1"></model-viewer>
        
        <div class="drop-zone" id="dropZone">
            <div style="font-size:50px; margin-bottom:10px;">🔨</div>
            <h3>Drop GLB File</h3>
            <button class="btn" style="width:auto; background:white; color:black; margin-top:10px;" onclick="document.getElementById('fileIn').click()">Browse</button>
            <input type="file" id="fileIn" accept=".glb" style="display:none">
        </div>
    </div>

    <aside class="sidebar">
        <div>
            <h1>Manya<span>Tools</span></h1>
        </div>

        <div>
            <div class="section-title">File Stats</div>
            <div class="stat-grid">
                <div class="stat-card"><span class="stat-val" id="uiSize">--</span><span class="stat-label">Size</span></div>
                <div class="stat-card"><span class="stat-val" id="uiTris">--</span><span class="stat-label">Triangles</span></div>
            </div>
            <div class="stat-card" style="width:100%"><span class="stat-val" id="uiTex">--</span><span class="stat-label">Textures Found</span></div>
        </div>

        <div>
            <div class="section-title">Optimization Settings</div>
            
            <!-- TEXTURE RESIZE -->
            <div class="control-box">
                <label style="font-size:0.8rem;">Texture Size (Max)</label>
                <select id="texSelect">
                    <option value="0">Keep Original (No Change)</option>
                    <option value="2048">2K (High)</option>
                    <option value="1024" selected>1K (Standard)</option>
                    <option value="512">512px (Mobile Optimized)</option>
                    <option value="256">256px (Tiny)</option>
                </select>
            </div>

            <!-- GEOMETRY -->
            <div class="control-box" style="margin-top:10px;">
                <label style="font-size:0.8rem;">Geometry Crunch (Draco)</label>
                <input type="range" id="geoSlider" min="4" max="14" value="9">
                <div style="display:flex; justify-content:space-between; font-size:0.6rem; color:#64748b;">
                    <span>Rough</span>
                    <span>Smooth</span>
                </div>
            </div>
        </div>

        <div class="log" id="statusLog">Ready.</div>

        <div style="display:flex; flex-direction:column; gap:10px;">
            <button id="btnRun" class="btn" disabled>CRUSH FILE</button>
            <button id="btnSave" class="btn btn-success">DOWNLOAD RESULT</button>
        </div>
    </aside>

    <!-- 4. LOGIC -->
    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
        import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

        const ui = {
            drop: document.getElementById('dropZone'),
            file: document.getElementById('fileIn'),
            viewer: document.getElementById('preview'),
            size: document.getElementById('uiSize'),
            tris: document.getElementById('uiTris'),
            tex: document.getElementById('uiTex'),
            run: document.getElementById('btnRun'),
            save: document.getElementById('btnSave'),
            log: document.getElementById('statusLog'),
            texSel: document.getElementById('texSelect'),
            geoSel: document.getElementById('geoSlider')
        };

        let scene = null;
        let animations = [];
        let originalName = "";
        let resultBlob = null;

        // UI Handlers
        ui.file.addEventListener('change', e => loadFile(e.target.files[0]));
        document.body.addEventListener('dragover', () => ui.drop.classList.add('active'));
        document.body.addEventListener('dragleave', (e) => { if(e.target===document.body || e.target===ui.drop) ui.drop.classList.remove('active'); });
        document.body.addEventListener('drop', (e) => { ui.drop.classList.remove('active'); if(e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]); });

        async function loadFile(file) {
            ui.log.innerText = "Reading file...";
            originalName = file.name;
            ui.size.innerText = (file.size / 1024 / 1024).toFixed(2) + " MB";
            ui.drop.classList.add('hidden');

            const url = URL.createObjectURL(file);
            ui.viewer.src = url;

            const buffer = await file.arrayBuffer();
            const draco = new DRACOLoader();
            draco.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
            draco.setDecoderConfig({ type: 'js' });

            const loader = new GLTFLoader();
            loader.setDRACOLoader(draco);

            try {
                const gltf = await loader.parseAsync(buffer, '');
                scene = gltf.scene;
                animations = gltf.animations;
                analyzeModel(scene);
                ui.run.disabled = false;
                ui.log.innerText = "Model Loaded. Configure and Run.";
            } catch (e) {
                console.error(e);
                ui.log.innerText = "Error: Invalid GLB.";
                ui.drop.classList.remove('hidden');
            }
        }

        function analyzeModel(model) {
            let tris = 0;
            let texCount = 0;
            
            model.traverse(o => {
                if(o.isMesh) {
                    tris += o.geometry.index ? o.geometry.index.count / 3 : o.geometry.attributes.position.count / 3;
                    if(o.material) {
                        ['map','normalMap','roughnessMap','metalnessMap','emissiveMap'].forEach(k => {
                            if(o.material[k]) texCount++;
                        });
                    }
                }
            });
            ui.tris.innerText = (tris / 1000).toFixed(1) + "k";
            ui.tex.innerText = texCount;
        }

        // --- THE CRUSHER ---
        ui.run.onclick = async () => {
            ui.run.disabled = true;
            ui.log.innerText = "Processing Textures...";
            
            // 1. Resize Textures
            const maxTexSize = parseInt(ui.texSel.value);
            if(maxTexSize > 0) {
                await processTextures(scene, maxTexSize);
            }

            ui.log.innerText = "Compressing Geometry...";
            
            // 2. Export with Draco
            setTimeout(() => {
                const q = parseInt(ui.geoSel.value);
                const exporter = new GLTFExporter();
                exporter.parse(
                    scene,
                    (res) => {
                        resultBlob = new Blob([res], { type: 'application/octet-stream' });
                        ui.viewer.src = URL.createObjectURL(resultBlob);
                        ui.log.innerText = `Done! New Size: ${(resultBlob.size/1024/1024).toFixed(2)} MB`;
                        ui.save.style.display = 'block';
                        ui.run.disabled = false;
                        ui.run.innerText = "RE-RUN";
                    },
                    (e) => { console.error(e); ui.log.innerText = "Export Failed"; },
                    {
                        binary: true,
                        animations: animations,
                        dracoOptions: {
                            compressionLevel: 7,
                            quantizationPos: q, quantizationNor: Math.max(6, q-2), 
                            quantizationTex: Math.max(8, q-2), quantizationCol: 8, quantizationGen: 8
                        }
                    }
                );
            }, 100);
        };

        // Texture Scaling Logic
        async function processTextures(model, maxSize) {
            const cache = new Map();
            
            const promises = [];
            
            model.traverse(o => {
                if(!o.isMesh || !o.material) return;
                
                ['map','normalMap','roughnessMap','metalnessMap'].forEach(key => {
                    if(o.material[key] && o.material[key].image) {
                        const tex = o.material[key];
                        // Avoid duplicates
                        if(cache.has(tex.uuid)) return;
                        cache.set(tex.uuid, true);

                        // Only resize if bigger than target
                        if(tex.image.width > maxSize || tex.image.height > maxSize) {
                            promises.push(resizeTexture(tex, maxSize));
                        }
                    }
                });
            });

            await Promise.all(promises);
        }

        function resizeTexture(texture, size) {
            return new Promise(resolve => {
                const img = texture.image;
                const canvas = document.createElement('canvas');
                const scale = Math.min(size/img.width, size/img.height);
                
                canvas.width = img.width * scale;
                canvas.height = img.height * scale;
                
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                
                const newImg = new Image();
                newImg.src = canvas.toDataURL('image/webp', 0.8); // Convert to WebP 80% quality
                
                newImg.onload = () => {
                    texture.image = newImg;
                    texture.needsUpdate = true;
                    resolve();
                };
            });
        }

        ui.save.onclick = () => {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(resultBlob);
            a.download = originalName.replace('.glb', '_min.glb');
            a.click();
        };

    </script>
</body>
</html>
