<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manya Prep Hub</title>
    <link rel="stylesheet" href="./app-shell/css/style.css">
    <link rel="manifest" href="manifest.json">
    <script type="module" src="./app-shell/js/lib/model-viewer.min.js"></script>
    <link rel="stylesheet" href="./assets/fonts/fonts.css">
    <!-- Load Font -->
</head>
<body>
    <!-- HEADER -->
    <header class="app-header">
    <div class="header-left">
        <!-- Back Button (Hidden by default) -->
        <button id="back-btn" class="nav-icon-btn hidden" onclick="ViewManager.goBack()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <!-- Menu Button -->
        <button id="menu-btn" class="nav-icon-btn" onclick="toggleSidebar()">☰</button>
    </div>
    
    <h3 id="app-title">Manya Prep Hub</h3>
    
    <div class="user-coins">💎 120</div>
</header>

    <!-- CONTENT MOUNT -->
    <div id="view-mount"></div>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">
        <div class="nav-item active" onclick="ViewManager.show('home', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Home</span>
        </div>
        <div class="nav-item" onclick="ViewManager.show('rankings', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
            <span>Rankings</span>
        </div>
        <div class="nav-item" onclick="ViewManager.show('profile', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span>Profile</span>
        </div>
    </nav>

    <!-- LOAD MODULES -->
<script type="module">
    // IMPORTANT: Note the './' at the start of the paths
    import { ViewManager } from './app-shell/view-manager.js';
    import { ManyaRouter } from './app-shell/router.js';

    // EXPOSE TO GLOBAL WINDOW (Fixes "ManyaRouter is not defined")
    window.ViewManager = ViewManager;
    window.ManyaRouter = ManyaRouter;

    // Start App
    ViewManager.init();
</script>


   
</body>
</html>
