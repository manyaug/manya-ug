    <!-- 5. APP LOGIC ENGINE -->
<script type="module">
    import { ViewManager } from './app-shell/view-manager.js';
    import { ManyaRouter } from './app-shell/router.js';
    import { QuestFactory } from './app-shell/quest-factory.js';
    import { QuestRunner } from './app-shell/quest-runner.js';
    import { AudioManager } from './app-shell/js/audio-manager.js';

    // --- CONFIGURATION ---
    const DEV_MODE = true; // Set to TRUE to force Onboarding on every refresh
    // ---------------------

    window.ViewManager = ViewManager;
    window.ManyaRouter = ManyaRouter;
    window.AudioManager = AudioManager;
    window.QuestFactory = QuestFactory;
    window.QuestRunner = QuestRunner;

    const splashOverlay = document.getElementById('manya-splash-overlay');
    const splashVid = document.getElementById('splash-vid');

    const startAppHandover = () => {
        splashVid.play().catch(() => {});

        setTimeout(() => {
            try {
                const userProfile = localStorage.getItem('manya_user_profile');

                // Logic Gate: If DEV_MODE is on OR no profile exists, show onboarding
                if (DEV_MODE || !userProfile) {
                    console.log("Manya: Entering Onboarding (Dev Mode Active)");
                    ViewManager.mount = document.getElementById('view-mount');
                    ViewManager.show('onboarding'); 
                } else {
                    console.log("Manya: Welcome back! Starting Hub...");
                    ViewManager.init();
                }

                document.body.classList.add('app-live');
            } catch (e) { 
                console.error("App Init Crash:", e); 
                ViewManager.init(); 
            }

            splashOverlay.style.opacity = '0';
            splashOverlay.style.pointerEvents = 'none';

            setTimeout(() => { if(splashOverlay.parentNode) splashOverlay.remove(); }, 1000);
        }, 3500);
    };

    if (document.readyState === 'complete') startAppHandover();
    else window.addEventListener('load', startAppHandover);

    // Global Launchers (Preserved)
    // Global Launchers (Preserved)
    window.launchLibraryStep = async (subject, unit, quest, step) => {
        try {
            // FIX: Ensure path starts with content/
            const path = `content/${subject}/${unit}/${quest}/${step}.json`;
            console.log("Fetching step:", path); // Debug log
            
            const res = await fetch(path);
            if (!res.ok) throw new Error(`HTTP ${res.status} - File not found: ${path}`);
            
            const data = await res.json();
            localStorage.setItem('last_sub', subject);
            localStorage.setItem('last_idx', -1); 
            localStorage.setItem('last_topic_name', data.title || "Lesson");
            
            const stepsToPlay = data.steps ? data.steps : [data];
            QuestRunner.start(ViewManager.mount, stepsToPlay);
            
            ViewManager.mount.classList.add('engine-mode');
            document.body.classList.add('fullscreen-mode');
        } catch (err) { 
            console.error("Launch Error:", err);
            alert("Could not load this lesson. Please check the file path.");
        }
    };            
</script>
