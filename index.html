<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manya Prep Hub</title>
    
    <!-- Core Stylesheets -->
    <link rel="stylesheet" href="./app-shell/css/style.css">
    <link rel="stylesheet" href="./app-shell/css/spiral.css">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="./assets/fonts/fonts.css">
    
    <script type="module" src="./app-shell/js/lib/model-viewer.min.js"></script>

    <!-- WORLD-CLASS SPLASH STYLES (Inline for Instant Paint) -->
    <style>
       #manya-splash-overlay {
            position: fixed; inset: 0;
            /* Use the fuzzy image as the static background */
            background: #941cb3 url('../../assets/icons/splash-1.png') no-repeat center center;
            background-size: cover;
            z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.8s ease-in-out;
        }

        /* Hide the portal circle initially so we only see the full-screen fuzzy face */
        .splash-portal {
            width: 260px; height: 260px;
            border-radius: 50%;
            overflow: hidden;
            opacity: 0; /* Hidden until video is ready */
            transition: opacity 0.5s ease;
        }

        #splash-vid {
            width: 100%; height: 100%;
            object-fit: cover;
            transform: scale(1.1); /* Hides video edge artifacts */
        }

        .splash-brand { margin-top: 35px; text-align: center; color: white; font-family: 'Nunito', sans-serif; }
        .splash-brand h1 { font-size: 30px; font-weight: 900; margin: 0; text-shadow: 0 0 20px rgba(124,58,237,0.5); }
        .splash-tagline { font-size: 10px; letter-spacing: 3px; color: #94a3b8; text-transform: uppercase; margin-top: 8px; }

        .splash-loader { width: 140px; height: 4px; background: rgba(255,255,255,0.1); border-radius: 10px; margin: 20px auto; overflow: hidden; }
        .splash-loader .fill { 
            width: 0%; height: 100%; 
            background: linear-gradient(90deg, #7c3aed, #db2777); 
            animation: loadProgress 3s cubic-bezier(0.4, 0, 0.2, 1) forwards; 
        }

        /* Hide UI bars while splash is active to prevent flickering */
        .app-header, .bottom-nav { opacity: 0; pointer-events: none; transition: opacity 0.5s; }
        .app-live .app-header, .app-live .bottom-nav { opacity: 1; pointer-events: all; }

        @keyframes loadProgress { to { width: 100%; } }
        @keyframes portalPop { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>
<!-- 2. MAIN APP HEADER -->
    <header class="app-header">
        <div class="header-left">
            <button id="back-btn" class="nav-icon-btn hidden" onclick="ViewManager.goBack()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
        </div>
        <h3 id="app-title">Manya Prep Hub</h3>
        <div class="user-coins">💎 120</div>
    </header>
    <!-- 1. SPLASH OVERLAY -->
    <div id="manya-splash-overlay">
    <div class="splash-portal" id="portal-mount">
        <video 
            id="splash-vid" 
            autoplay muted playsinline loop 
            preload="auto"
            poster="assets/icons/splash-1.png"> <!-- YOUR NEW IMAGE HERE -->
            <source src="assets/shared/videos/mascot_blink.mp4" type="video/mp4">
        </video>
    </div>
    
    <div class="splash-brand">
        <h1 style="color: white; text-shadow: 0 4px 10px rgba(0,0,0,0.3);">Manya Prep Hub</h1>
        <div class="splash-loader"><div class="fill"></div></div>
    </div>
</div>

    

    <!-- 3. CONTENT MOUNT -->
    <div id="view-mount"></div>

    <!-- 4. BOTTOM NAVIGATION -->
    <nav class="bottom-nav">
        <div class="nav-item active" onclick="ViewManager.show('home', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Home</span>
        </div>
        <div class="nav-item" onclick="ViewManager.show('rankings', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
            <span>Rankings</span>
        </div>
        <div class="nav-item" onclick="ViewManager.show('profile', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span>Profile</span>
        </div>
    </nav>

    <!-- 5. APP LOGIC ENGINE -->
   <script type="module">
    import { ViewManager } from './app-shell/view-manager.js';
    import { ManyaRouter } from './app-shell/router.js';
    import { QuestFactory } from './app-shell/quest-factory.js';
    import { QuestRunner } from './app-shell/quest-runner.js';
    import { AudioManager } from './app-shell/js/audio-manager.js';

    window.ViewManager = ViewManager;
    window.ManyaRouter = ManyaRouter;
    window.AudioManager = AudioManager;

   const video = document.getElementById('splash-vid');
const portal = document.getElementById('portal-mount');

// When the video is ready, fade the circle in over the static background
video.onplay = () => {
    portal.style.opacity = '1';
};

const startAppSequence = () => {
    video.play().catch(() => {});
    
    setTimeout(() => {
        const overlay = document.getElementById('manya-splash-overlay');
        overlay.style.opacity = '0';
        
        // Start the actual app logic
        ViewManager.init();

        setTimeout(() => overlay.remove(), 1000);
    }, 3500); // Give it 3.5 seconds of glory
};

window.addEventListener('load', startAppSequence);

    // --- REPAIRED LIBRARY STEP LAUNCHER ---
    
    window.launchLibraryStep = async (subject, unit, quest, step) => {
    // Correct path construction
    const path = `../content/${subject}/${unit}/${quest}/${step}.json`;
    
    try {
        const response = await fetch(path);
        if (!response.ok) throw new Error(`File not found: ${path}`);
        const data = await response.json();

        localStorage.setItem('last_sub', subject);
        localStorage.setItem('last_idx', -1); // Library mode

        // Start QuestRunner with an array containing the single step
        QuestRunner.start(ViewManager.mount, [data]);
        
        ViewManager.mount.classList.add('engine-mode');
        document.body.classList.add('fullscreen-mode');
    } catch (err) {
        alert("This specific lesson is currently under maintenance.");
        console.error(err);
    }
};
</script>
</body>
</html>
