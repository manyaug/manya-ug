<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manya Prep Hub</title>
    <link rel="stylesheet" href="./app-shell/css/style.css">
    <link rel="stylesheet" href="./app-shell/css/spiral.css">
    <link rel="manifest" href="manifest.json">
    <script type="module" src="./app-shell/js/lib/model-viewer.min.js"></script>
    <link rel="stylesheet" href="./assets/fonts/fonts.css">

    <style>
        #manya-splash-overlay {
            position: fixed; inset: 0;
            background: radial-gradient(circle at center, #2e1065 0%, #0f172a 100%);
            z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: all;
        }
        .splash-portal {
            width: 220px; height: 220px;
            border-radius: 50%;
            border: 8px solid rgba(255, 255, 255, 0.1);
            background: #000;
            box-shadow: 0 0 80px rgba(124, 58, 237, 0.3);
            overflow: hidden;
            animation: portalPop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #splash-vid { width: 100%; height: 100%; object-fit: cover; transform: scale(1.05); }
        .splash-brand { margin-top: 30px; text-align: center; color: white; font-family: sans-serif; }
        .splash-loader { width: 140px; height: 4px; background: rgba(255,255,255,0.1); border-radius: 10px; margin: 15px auto; overflow: hidden; }
        .splash-loader .fill { width: 0%; height: 100%; background: linear-gradient(90deg, #7c3aed, #db2777); animation: load 3s forwards; }
        @keyframes load { to { width: 100%; } }
        @keyframes portalPop { from { transform: scale(0); } to { transform: scale(1); } }
    </style>
    <!-- Load Font -->
</head>
<body>
 <div id="manya-splash-overlay">
        <div class="splash-portal">
            <!-- Added preload="auto" and fixed the path -->
            <video id="splash-vid" autoplay muted playsinline loop preload="auto">
                <source src="assets/shared/videos/mascot_blink.mp4" type="video/mp4">
            </video>
        </div>
        <div class="splash-brand">
            <h1 style="font-size: 28px; font-weight: 900; margin:0;">Manya Prep Hub</h1>
            <p style="font-size: 10px; letter-spacing: 3px; color: #94a3b8; text-transform: uppercase;">Elite PLE Preparation</p>
            <div class="splash-loader"><div class="fill"></div></div>
        </div>
    </div>

    <!-- HEADER -->
    <header class="app-header">
    <div class="header-left">
        <!-- Back Button (Hidden by default) -->
        <button id="back-btn" class="nav-icon-btn hidden" onclick="ViewManager.goBack()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <!-- Menu Button -->
        <button id="menu-btn" class="nav-icon-btn" onclick="toggleSidebar()">☰</button>
    </div>
    
    <h3 id="app-title">Manya Prep Hub</h3>
    
    <div class="user-coins">💎 120</div>
</header>

    <!-- CONTENT MOUNT -->
    <div id="view-mount"></div>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">
        <div class="nav-item active" onclick="ViewManager.show('home', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Home</span>
        </div>
        <div class="nav-item" onclick="ViewManager.show('rankings', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
            <span>Rankings</span>
        </div>
        <div class="nav-item" onclick="ViewManager.show('profile', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span>Profile</span>
        </div>
    </nav>

    <!-- LOAD MODULES -->
<script type="module">
    import { ViewManager } from './app-shell/view-manager.js';
    import { ManyaRouter } from './app-shell/router.js';
    import { QuestFactory } from './app-shell/quest-factory.js';
    import { QuestRunner } from './app-shell/quest-runner.js';

    // 1. EXPOSE TO GLOBAL WINDOW
    window.ViewManager = ViewManager;
    window.ManyaRouter = ManyaRouter;

    const overlay = document.getElementById('manya-splash-overlay');
    const video = document.getElementById('splash-vid');

    // 2. THE HANDOVER LOGIC
    const startAppSequence = () => {
        // Force video play (in case browser blocked it)
        video.play().catch(() => {});

        // Wait 3 seconds for the "World Class" entrance
        setTimeout(() => {
            overlay.style.opacity = '0';
            
            // Start the App Engine ONLY AFTER the splash starts fading
            ViewManager.init();

            // Remove overlay from memory after fade-out
            setTimeout(() => overlay.remove(), 1000);
        }, 3200);
    };

    // Trigger as soon as the page is "Ready"
    if (document.readyState === 'complete') {
        startAppSequence();
    } else {
        window.addEventListener('load', startAppSequence);
    }

    // 3. QUEST LAUNCHER
    window.launchDynamicQuest = async (subject, topic) => {
        try {
            ViewManager.mount.innerHTML = '<div class="manya-loader">Preparing Journey...</div>';
            const manifest = await QuestFactory.buildQuest(subject, topic);
            QuestRunner.renderQuest(ViewManager.mount, manifest);
            ViewManager.mount.classList.add('engine-mode');
        } catch (err) {
            console.error("Factory Error:", err);
            alert("Could not build quest.");
        }
    };
</script>


   
</body>
</html>
