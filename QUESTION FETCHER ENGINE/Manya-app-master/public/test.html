<!DOCTYPE html>
<html>
<head>
    <title>Script Load Test</title>
</head>
<body>
    <h1>Script Load Test</h1>
    <div id="output"></div>

    <script>
        const output = document.getElementById('output');
        function log(msg) {
            output.innerHTML += msg + '<br>';
            console.log(msg);
        }
    </script>

    <!-- Load scripts in order -->
    <script src="js/components/challenge-card.js"></script>
    <script src="js/components/quest-progress.js"></script>
    <script src="js/components/game-modes.js"></script>
    <script src="js/simulation-loader.js"></script>
    <script src="js/quest.js"></script>
    <script src="js/challenges.js"></script>
    <script src="js/app.js"></script>

    <script>
        setTimeout(() => {
            log('--- FINAL CHECK ---');
            log('QuestScreen: ' + (typeof QuestScreen !== 'undefined' ? '✅' : '❌'));
            log('ChallengesScreen: ' + (typeof ChallengesScreen !== 'undefined' ? '✅' : '❌'));
            log('GameModes: ' + (typeof GameModes !== 'undefined' ? '✅' : '❌'));
        }, 500);
    </script>
</body>
</html>
