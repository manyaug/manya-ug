<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manya – Spine Labeling (Options Below + Hints on Pins)</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body { margin:0; font-family:system-ui, sans-serif; background:#f8fafc; overflow:hidden; }
    #root { width:100vw; height:100vh; position:relative; background:#0f172a; display:flex; flex-direction:column; }
    model-viewer { width:100%; height:65%; } /* ← more space for model */
    .header { background:rgba(0,0,0,0.5); color:white; padding:12px 16px; text-align:center; }
    .status { background:rgba(255,255,255,0.95); padding:12px 24px; border-radius:12px; font-weight:700; box-shadow:0 4px 15px rgba(0,0,0,0.2); margin:10px auto; text-align:center; width:90%; max-width:500px; }
    .wordbank { padding:20px; background:white; display:flex; flex-wrap:wrap; gap:12px; justify-content:center; z-index:80; }
    .wordbank button { padding:12px 20px; background:#fff; border:2px solid #e2e8f0; border-radius:12px; font-weight:700; cursor:pointer; transition:0.2s; min-width:140px; }
    .wordbank button.selected { background:#e9d5ff; border-color:#7c3aed; color:#4c1d95; }
    .controls { padding:20px; background:white; display:flex; gap:16px; justify-content:center; border-top:1px solid #e2e8f0; }
    .submit-btn { padding:14px 40px; font-size:16px; font-weight:700; background:#7c3aed; color:white; border:none; border-radius:30px; cursor:pointer; }
    .submit-btn:disabled { background:#cbd5e1; cursor:not-allowed; }
    .reset-btn { padding:14px 40px; font-size:16px; font-weight:700; background:#6b7280; color:white; border:none; border-radius:30px; cursor:pointer; }
    .Hotspot { 
      width: 18px; height: 18px; border-radius: 50%; 
      background: #7c3aed; border: 3px solid white; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.3); cursor: pointer; 
      transition: 0.2s;
    }
    .Hotspot.selected { transform: scale(1.4); background: #c084fc; border-color: white; }
    .Hotspot.labeled { background: #a78bfa; border-color: white; }
    .HotspotAnnotation { 
      background: rgba(255,255,255,0.95); padding: 6px 12px; border-radius: 8px;
      position: absolute; top: -45px; left: 50%; transform: translateX(-50%);
      box-shadow: 0 4px 15px rgba(0,0,0,0.15); font-size: 12px; font-weight: 700; 
      pointer-events: none; opacity: 0; transition: opacity 0.2s;
      white-space: nowrap;
    }
    .Hotspot.selected .HotspotAnnotation,
    .Hotspot.labeled .HotspotAnnotation { opacity: 1; top: -55px; }
  </style>
</head>
<body>

<div id="root">
  <div class="header">
    <span>Label the parts of the spine</span>
  </div>
  <div class="status" id="status">Tap a purple dot to select a part, then choose its name below</div>
  <model-viewer id="viewer" 
    src="assets/science/musklo-skeletal-system/quest_3_axial_skull_spine/the_human_spinal_column.glb"
    camera-controls 
    shadow-intensity="1"
    camera-orbit="0deg 75deg 105%"
    min-camera-orbit="auto auto 50%"
    max-camera-orbit="auto auto 200%">
    <!-- Hotspots added dynamically below -->
  </model-viewer>
  <div class="wordbank" id="wordbank"></div>
  <div class="controls">
    <button class="submit-btn" id="submitBtn" disabled onclick="submitAnswers()">Submit Answers</button>
    <button class="reset-btn" onclick="resetAll()">Reset</button>
  </div>
</div>

<script>
// YOUR JSON DATA
const simData = {
  "mode": "labeling",
  "variantTitle": "Spine: Anatomy & Bone Counts",
  "modelUrl": "assets/science/musklo-skeletal-system/quest_3_axial_skull_spine/the_human_spinal_column.glb",
  "hotspots": [
    { "id": "1", "label": "Neck Region (7)", "pos": "-82.26 159.32 -0.47", "norm": "-1 0 0" },
    { "id": "2", "label": "Chest Region (12)", "pos": "-82.03 137.76 -7.94", "norm": "-1 0 0" },
    { "id": "3", "label": "Lower Back (5)", "pos": "-82.67 115.05 -2.26", "norm": "-1 0 0" },
    { "id": "6", "label": "Tailbone", "pos": "-80.11 98.83 -11.06", "norm": "-1 0 0" }
  ],
  "wordBank": ["Neck Region (7)", "Chest Region (12)", "Lower Back (5)", "Tailbone", "Skull", "Pelvis"]
};

// RENDER FUNCTION
function renderLabeling(container, data) {
  // Clear container and rebuild
  container.innerHTML = `
    <div class="header">
      <span>${data.variantTitle || 'Label the parts'}</span>
    </div>
    <div class="status" id="status">Tap a purple dot to select a part, then choose its name</div>
    <model-viewer id="viewer" 
      src="${data.modelUrl}" 
      camera-controls 
      shadow-intensity="1"
      camera-orbit="0deg 75deg 105%"
      min-camera-orbit="auto auto 50%"
      max-camera-orbit="auto auto 200%">
      ${data.hotspots.map(h => `
        <button class="Hotspot" slot="hotspot-${h.id}" 
                data-id="${h.id}" data-position="${h.pos}" data-normal="${h.norm || '0 1 0'}">
          <div class="HotspotAnnotation" id="anno-${h.id}"></div>
        </button>
      `).join('')}
    </model-viewer>
    <div class="wordbank" id="wordbank">
      ${data.wordBank.map(w => `<button data-word="${w}">${w}</button>`).join('')}
    </div>
    <div class="controls">
      <button class="submit-btn" id="submitBtn" disabled onclick="submitAnswers()">Submit Answers</button>
      <button class="reset-btn" onclick="resetAll()">Reset</button>
    </div>
  `;

  const viewer = container.querySelector('#viewer');
  const status = container.querySelector('#status');
  const submitBtn = container.querySelector('#submitBtn');
  const wordButtons = container.querySelectorAll('.wordbank button');
  const hotspots = container.querySelectorAll('.Hotspot');

  const userSelections = {}; // pinId → chosen word

  viewer.addEventListener('load', () => {
    status.innerText = "Tap a purple dot to select a part, then choose its name";
  });

  // Pin selection
  hotspots.forEach(pin => {
    pin.onclick = () => {
      hotspots.forEach(p => p.classList.remove('selected'));
      pin.classList.add('selected');
      window.currentPin = pin.dataset.id;
      status.innerText = "Now choose the name for this part from below";
    };
  });

  // Word selection – show chosen word as hint on pin
  wordButtons.forEach(btn => {
    btn.onclick = () => {
      if (!window.currentPin) {
        status.innerText = "⚠️ Tap a purple dot first!";
        return;
      }

      const selectedWord = btn.dataset.word;
      userSelections[window.currentPin] = selectedWord;

      // Show chosen word as floating hint
      const anno = container.querySelector(`#anno-${window.currentPin}`);
      anno.innerText = selectedWord;
      const pin = container.querySelector(`[data-id="${window.currentPin}"]`);
      pin.classList.add('labeled');

      // Visual cue on button
      wordButtons.forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');

      status.innerText = `Labeled as "${selectedWord}". Continue labeling or Submit.`;

      // Auto-deselect pin
      hotspots.forEach(p => p.classList.remove('selected'));
      window.currentPin = null;

      // Enable Submit only when all labeled
      checkAllLabeled();
    };
  });

  // Enable Submit when all pins have a label
  function checkAllLabeled() {
    const allLabeled = data.hotspots.every(h => userSelections[h.id]);
    submitBtn.disabled = !allLabeled;
    if (allLabeled) {
      status.innerText = "All parts labeled! Click Submit to check your answers.";
    }
  }

  // Submit – check all answers
  window.submitAnswers = () => {
    let allCorrect = true;
    data.hotspots.forEach(h => {
      if (userSelections[h.id] !== h.label) {
        allCorrect = false;
      }
    });

    if (allCorrect) {
      status.innerHTML = `<span style="color:#16a34a; font-size:1.3em;">✅ Completed correctly! Perfect score!</span>`;
    } else {
      status.innerHTML = `<span style="color:#dc2626; font-size:1.2em;">Completed – but incorrect (some parts are wrong).</span>`;
    }
  };

  // Reset everything
  window.resetAll = () => {
    window.currentPin = null;
    Object.keys(userSelections).forEach(k => delete userSelections[k]);
    status.innerText = "Tap a purple dot to select a part, then choose its name";
    hotspots.forEach(p => {
      p.classList.remove('selected', 'labeled');
      container.querySelector(`#anno-${p.dataset.id}`).innerText = '';
    });
    wordButtons.forEach(b => b.classList.remove('selected'));
    submitBtn.disabled = true;
    viewer.cameraTarget = "auto auto auto";
    viewer.cameraOrbit = "0deg 75deg 105%";
  };
}

// RUN
renderLabeling(document.getElementById('root'), simData);
</script>
</body>
</html>
